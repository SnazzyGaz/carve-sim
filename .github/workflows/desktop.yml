# Builds the Carve Sim desktop apps (Tauri v2) for Windows, macOS and Linux and attaches the
# installers to a draft GitHub Release. Builds are unsigned. Pages publishing is separate (gh-pages branch).
name: Desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: '--bundles nsis,msi'
          - name: macOS (universal)
            platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - name: Linux
            platform: ubuntu-22.04
            args: '--bundles appimage,deb'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Only the Tauri CLI is needed; the web app in app/ ships as-is (vendor files are committed).
      - name: Install Tauri CLI
        run: npm ci --ignore-scripts

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Carve Sim ${{ github.ref_type == ''tag'' && github.ref_name || ''v__VERSION__'' }}'
          releaseBody: |
            Desktop builds of Carve Sim. They are unsigned:
            - Windows: SmartScreen may warn. Click **More info > Run anyway**.
            - macOS: the first time, right-click the app and choose **Open** (or System Settings > Privacy & Security > **Open Anyway**).
            - Linux: make the AppImage executable (`chmod +x`) and run it, or install the .deb.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
