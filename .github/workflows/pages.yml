# Publishes app/ to the gh-pages branch (the site's source) after the smoke test passes on main.
# Replaces copying app/ to gh-pages by hand. No build step: app/ ships as-is.
name: Publish site
on:
  workflow_run:
    workflows: [Smoke test]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          commit_message: 'Publish app/ from ${{ github.event.workflow_run.head_sha }}'
